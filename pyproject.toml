[project]
name = "scholaragent"
version = "0.2.0"
description = "Multi-agent scientific literature research system with persistent memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Basilios P.", email = "100252546+byBasiliosP@users.noreply.github.com" },
]
keywords = [
    "research",
    "multi-agent",
    "mcp",
    "arxiv",
    "semantic-scholar",
    "literature-review",
    "rlhf",
    "llm",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "mcp[cli]>=1.0",
    "numpy>=1.26",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.6",
]
extraction = [
    "trafilatura>=1.8.0",
]
web = [
    "playwright>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/byBasiliosP/RLM-Agent"
Repository = "https://github.com/byBasiliosP/RLM-Agent"
Issues = "https://github.com/byBasiliosP/RLM-Agent/issues"

[project.scripts]
scholaragent-server = "scholaragent.mcp_server:main"
scholaragent-install = "scholaragent.installer:main"

[tool.pytest.ini_options]
# No tests use async; the asyncio plugin causes deadlocks with
# threading.Lock-based lazy init in RuntimeContainer and MemoryStore.
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "build", "dist", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E402",  # module-import-not-at-top (intentional deferred imports)
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
    "SIM102",  # nested if (readability preference)
    "SIM105",  # suppressible-exception (contextlib.suppress is not always clearer)
    "SIM108",  # ternary vs if-else (preference)
    "UP047",  # non-pep695-generic (requires refactor)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B007",   # unused loop control variable
    "B011",   # assert False in tests is fine
    "B017",   # assertRaises(Exception) is common in broad negative tests
    "F401",   # allow unused imports (conditional imports in tests)
    "F811",   # redefined names (common for fixture/helper shadowing)
    "F841",   # unused variables are fine in test scaffolding
    "RUF012", # mutable class defaults are fine for test helpers
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false
strict = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
